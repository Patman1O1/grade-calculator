[package]
name = "grade-calculator"
version = "0.1.0"
edition = "2024"
description = "Course grade calculator engine, compiled to WebAssembly for the React front-end"
license-file = "../LICENSE"
publish = false

[lib]
name = "grade_calculator"
path = "src/lib.rs"
# cdylib: the .wasm module the browser loads. rlib: native tests and benchmarks.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[profile.release]
lto = true
codegen-units = 1
